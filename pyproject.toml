[project]
name = "agent-analyse"
version = "0.1.0"
description = "Multi-agent analyst platform bootstrap."
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "dynaconf>=3.2.6",
    "fastapi>=0.111.0",
    "langfuse>=2.40.0",
    "litellm>=1.40.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "python-telegram-bot>=21.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "common*", "config*"]
exclude = ["docs*", "migrations*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
